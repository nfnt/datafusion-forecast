# git-cliff configuration for the GitHub Release notes, generated from Conventional Commits. Run
# `git cliff` locally for a full changelog. See https://git-cliff.org/docs/configuration.

[changelog]
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Drop conventional commits that match no parser below, but keep breaking changes of skipped types.
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments order the groups and are stripped from the output.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^refactor", group = "<!-- 4 -->Refactor" },
    # Breaking changes of otherwise skipped types; without a group they render under an empty heading.
    { message = "^[a-z]+(\\(.*\\))?!:", group = "<!-- 5 -->Other Breaking Changes" },
    { body = "BREAKING[ -]CHANGE", group = "<!-- 5 -->Other Breaking Changes" },
    { message = "^(chore|ci|build|style|test)", skip = true },
]
