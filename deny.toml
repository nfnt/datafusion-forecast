# cargo-deny configuration. Run locally with `cargo deny check` (requires
# `cargo install cargo-deny`); CI runs it via EmbarkStudios/cargo-deny-action.
#
# The allow-list below was derived from the actual dependency tree
# (`cargo metadata --format-version=1 | jq -r '.packages[].license'`, deduped)
# under default features.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # 'paste' is unmaintained (archived by its author, no replacement
    # planned). It's a transitive compile-time proc-macro dependency via
    # candle-core -> gemm (also through pulp) and candle-core -> tokenizers,
    # below anything this project controls; it isn't linked into the built
    # binaries. There is no safe upgrade -- re-evaluate when candle-core's
    # dependencies drop it.
    "RUSTSEC-2024-0436",
    # chrono, chrono-tz and humantime are unmaintained (no known vulnerability,
    # no patched versions). All are transitive runtime dependencies via
    # datafusion -> arrow / object_store; we don't use them directly.
    # Re-evaluate on each datafusion upgrade:
    # https://github.com/apache/arrow-rs/issues/9183 (chrono, chrono-tz)
    # https://github.com/apache/arrow-rs-object-store/issues/909 (chrono)
    # https://github.com/apache/arrow-rs-object-store/issues/292 (humantime)
    "RUSTSEC-2026-0542",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
