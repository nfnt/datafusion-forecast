[package]
name = "datafusion-forecast"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Time-series forecasting as Apache DataFusion SQL functions"
readme = "README.md"
keywords = ["datafusion", "forecasting", "time-series", "sql", "timestral"]
categories = ["database", "science"]

[package.metadata.docs.rs]
features = ["hub"]

[features]
default = ["timestral"]
timestral = ["dep:candle-timestral"]
hub = ["timestral", "candle-timestral/hub"]
accelerate = ["timestral", "candle-timestral/accelerate"]
cuda = ["timestral", "candle-timestral/cuda"]
cudnn = ["timestral", "candle-timestral/cudnn"]
metal = ["timestral", "candle-timestral/metal"]
mkl = ["timestral", "candle-timestral/mkl"]

[dependencies]
candle-timestral = { workspace = true, optional = true }
datafusion.workspace = true

[dev-dependencies]
candle-core.workspace = true
candle-nn.workspace = true
datafusion = { workspace = true, features = ["sql", "nested_expressions"] }
serde_json.workspace = true
tokio.workspace = true

[[example]]
name = "sql"
required-features = ["timestral"]
