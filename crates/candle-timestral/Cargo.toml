[package]
name = "candle-timestral"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Inference for Mistral AI's Timestral time-series forecasting models with Candle"
readme = "README.md"

[features]
hub = ["dep:hf-hub"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["candle-core/cudnn", "candle-nn/cudnn", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
hf-hub = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[[example]]
name = "forecast"
