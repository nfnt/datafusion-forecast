[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nfnt/datafusion-forecast"

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-timestral = { path = "crates/candle-timestral", version = "0.1.0" }
datafusion = { version = "55.2", default-features = false }
hf-hub = { version = "1", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
